name: release

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches PKG_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^PKG_VERSION:=//p' package/sms2discord/Makefile)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != PKG_VERSION $v"; exit 1; }

      - name: Self-test (Lua 5.1, as on OpenWrt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-cjson nodejs
          lua5.1 package/sms2discord/files/sms2discord.lua selftest

      - name: Check LuCI files
        run: |
          node --check package/luci-app-sms2discord/htdocs/luci-static/resources/view/sms2discord.js
          for f in package/luci-app-sms2discord/root/usr/share/*/*.d/*.json; do python3 -m json.tool "$f" >/dev/null; done
          [ "$(sed -n 's/^PKG_VERSION:=//p' package/sms2discord/Makefile)" = "$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-sms2discord/Makefile)" ]

      - name: Build ipk
        run: |
          tools/build-ipk.sh
          # stable names for releases/latest/download/<name>
          cp dist/sms2discord_*-*_all.ipk dist/sms2discord_all.ipk
          cp dist/luci-app-sms2discord_*-*_all.ipk dist/luci-app-sms2discord_all.ipk

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk

      - name: Build opkg feed
        run: |
          tools/build-feed.sh
          mkdir -p site/packages
          cp dist/feed/* site/packages/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>sms2discord opkg feed</title>
          <link rel="icon" href="favicon.png">
          <p><img src="logo.png" alt="sms2discord logo" width="160"></p>
          <h1>sms2discord opkg feed</h1>
          <p>Add this source on your router, then install <code>sms2discord</code> and <code>luci-app-sms2discord</code>:</p>
          <pre>https://koraysels.github.io/sms2discord/packages</pre>
          <p>GL.iNet: Applications → Plug-ins → Manage Sources. OpenWrt: add
          <code>src/gz sms2discord https://koraysels.github.io/sms2discord/packages</code> to <code>/etc/opkg/customfeeds.conf</code>.</p>
          <p><a href="https://github.com/koraysels/sms2discord">Documentation and source</a> · <a href="packages/Packages">Packages</a></p>
          HTML
          cp docs/logo.png docs/favicon.png site/

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          path: site

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.ipk --generate-notes --title "${GITHUB_REF_NAME}" || gh release upload "${GITHUB_REF_NAME}" dist/*.ipk --clobber

  pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
